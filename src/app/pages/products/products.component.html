<div class="container-fluid mt-4">
  <div class="row">
    <!-- Sidebar Filters -->
    <div class="col-md-3">
      <div class="filters p-3 border rounded bg-light">
        <h5 class="mb-3">Filters</h5>

        <!-- Categories -->
        <div class="mb-4">
          <h6>Category</h6>
          <ul class="list-unstyled">
            <li *ngFor="let cat of categories">
              <input type="radio" name="cat" [value]="cat" (change)="filterByCategory(cat)"
                [checked]="selectedCategory === cat" />
              {{ cat }}
            </li>
          </ul>
        </div>

        <!-- Price -->
        <div class="mb-4">
          <h6>Price</h6>
          <input type="range" min="50" max="500" [(ngModel)]="priceRange" (input)="applyFilter()" />
          <p class="small">Up to: <b>{{ priceRange }}$</b></p>
        </div>

        <button class="btn btn-dark w-100" (click)="applyFilter()">Apply Filter</button>
      </div>
    </div>

    <!-- Products Grid -->
    <div class="col-md-9">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Products</h3>

        <button *ngIf="isAdmin" class="btn btn-success ms-2" (click)="addNewProduct()">
          <i class="fas fa-plus"></i> Add New Product
        </button>

        <select class="form-select w-auto" [(ngModel)]="sortBy" (change)="applySorting()">
          <option value="popular">Most Popular</option>
          <option value="low">Price: Low to High</option>
          <option value="high">Price: High to Low</option>
        </select>
      </div>

      <!-- Product Cards -->
      <div class="row g-3">
        <div class="col-6 col-md-4 col-lg-3" *ngFor="let product of filterProducts">
          <div class="card bg-transparent h-100 shadow-sm position-relative product-card">

            <!-- Delete Button (Admin Only) -->
            <button *ngIf="isAdmin" class="btn btn-danger btn-sm position-absolute top-0 end-0 m-2" style="z-index: 10;"
              (click)="deleteProduct(product.id, $event)">
              <i class="fas fa-trash"></i>
            </button>

            <img [src]="product.image" alt="" class="card-img-top p-2" style="height: 200px; object-fit: contain;">
            <div class="card-body d-flex flex-column p-2">
              <h6 class="fw-semibold text-truncate" title="{{ product.title }}" style="font-size: 0.9rem;">{{
                product.title }}</h6>
              <p class="text-muted mb-1" style="font-size: 0.85rem;">${{ product.price }}</p>

              <!-- Rating -->
              <div class="d-flex align-items-center mb-1" style="font-size: 0.75rem;">
                <ng-container *ngFor="let star of [1,2,3,4,5]">
                  <span class="me-1" [ngClass]="{
                  'text-warning': (product.rating.rate) >= star,
                  'text-secondary': (product.rating.rate) < star
                }">
                    ★
                  </span>

                </ng-container>
                <small class="text-dark ms-1 fw-semibold">
                  {{ product.rating.rate }}
                </small>
              </div>

              <small class="text-muted mb-2" style="font-size: 0.7rem;">
                ({{ product.rating.count }} reviews)
              </small>

              <!-- Buttons -->
              <div class="mt-auto">
                <button class="btn btn-dark btn-sm w-100 mb-1" style="font-size: 0.8rem;" (click)="addToCart(product)">
                  Add Cart
                </button>
                <button class="btn btn-outline-dark btn-sm w-100" style="font-size: 0.8rem;"
                  (click)="gotoProductDetails(product.id)">
                  View Details
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>


    </div>
  </div>
</div>
