
<div class="container-fluid mt-4">
  <div class="row">
    <!-- Sidebar Filters -->
    <div class="col-md-3">
      <div class="filters p-3 border rounded bg-light">
        <h5 class="mb-3">Filters</h5>

        <!-- Categories -->
        <div class="mb-4">
          <h6>Category</h6>
          <ul class="list-unstyled">
            <li *ngFor="let cat of categories">
              <input 
                type="radio" 
                name="cat" 
                [value]="cat" 
                (change)="filterByCategory(cat)"
                [checked]="selectedCategory === cat" 
              />
              {{ cat }}
            </li>
          </ul>
        </div>

        <!-- Price -->
        <div class="mb-4">
          <h6>Price</h6>
          <input 
            type="range" 
            min="50" 
            max="500" 
            [(ngModel)]="priceRange" 
            (input)="applyFilter()" 
          />
          <p class="small">Up to: <b>{{ priceRange }}$</b></p>
        </div>

        <button class="btn btn-dark w-100" (click)="applyFilter()">Apply Filter</button>
      </div>
    </div>

    <!-- Products Grid -->
    <div class="col-md-9">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Products</h3>
        <select class="form-select w-auto" [(ngModel)]="sortBy" (change)="applySorting()">
          <option value="popular">Most Popular</option>
          <option value="low">Price: Low to High</option>
          <option value="high">Price: High to Low</option>
        </select>
      </div>

      <!-- Product Cards -->
      <div class="row">
        <div class="col-md-4 " *ngFor="let product of filterProducts">
          <div class="card bg-transparent h-75 shadow-sm">
            <img [src]="product.image" alt="" class="w-100 h-50">
            <div class="card-body d-flex flex-column">
              <h6 class="fw-semibold">{{ product.title }}</h6>
              <p class="text-muted mb-2">${{ product.price }}</p>

              <!-- Rating -->
              <div class="d-flex align-items-center mb-2">
                <ng-container *ngFor="let star of [1,2,3,4,5]">
                  <span class="me-1" [ngClass]="{
                  'text-warning': (product.rating.rate) >= star,
                  'text-secondary': (product.rating.rate) < star
                }">
                  ★
                </span>
                
                </ng-container>
                <small class="text-dark ms-2 fw-semibold">
                  {{ product.rating.rate }}/5
                </small>
              </div>

              <small class="text-muted mb-3">
                ({{ product.rating.count }} reviews)
              </small>

              <!-- Buttons -->
              <div class="mt-4">
                <button class="btn btn-dark btn-sm w-100 mb-2" (click)="addToCart(product)">
                  Add Cart
                </button>
                <button class="btn btn-outline-dark btn-sm w-100" (click)="gotoProductDetails(product.id)">
                  View Details
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

     
    </div>
  </div>
</div>
