<div class="container my-3 d-flex justify-content-center align-items-center vh-100">
  <div class="register-card shadow p-4">
    <h3 class="text-center mb-4 fw-bold">Create Account</h3>

    <form (ngSubmit)="register()">
      <div class="mb-3">
        <label class="form-label">Full Name</label>
        <input type="text" class="form-control" [(ngModel)]="name" name="name" placeholder="Enter your name" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" [(ngModel)]="email" name="email" placeholder="Enter your email" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" [(ngModel)]="password" name="password" placeholder="Enter password" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Confirm Password</label>
        <input type="password" class="form-control" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="Confirm password" required>
      </div>

      <div *ngIf="errorMessage" class="text-danger mb-3">{{ errorMessage }}</div>

      <button type="submit" class="btn btn-primary w-100 py-2 fw-bold" [routerLink]="['/home']">Register</button>
    </form>

    <div class="text-center mt-3">
      <p class="text-muted">Or sign up with:</p>
      <button type="button" class="btn btn-outline-warning me-2 w-100" (click)="loginWithGoogle()">
  <i class="fab fa-google me-2"></i> Google
</button>

      
    </div>

    <p class="text-center mt-3 text-muted">
      Already have an account? <a [routerLink]="['/login']">Login</a>

    </p>
  </div>
</div>
